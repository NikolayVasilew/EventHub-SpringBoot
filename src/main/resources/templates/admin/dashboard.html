<!doctype html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Администрация | EventHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <header th:replace="~{fragments/nav :: nav}"></header>
    <main class="container">
      <div class="sectionhead">
        <h1>Администрация</h1>
        <a class="btn" th:href="@{/admin/events/new}">+ Ново събитие</a>
      </div>
      <p class="alert success" th:if="${success}" th:text="${success}"></p>
      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>Събитие</th>
              <th>Дата</th>
              <th>Записани</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="e : ${events}">
              <td th:text="${e.title}"></td>
              <td
                th:text="${#temporals.format(e.startsAt,'dd.MM.yyyy HH:mm')}"
              ></td>
              <td
                th:text="${registrationCounts[e.id]}+' / '+${e.capacity}"
              ></td>
              <td class="actions">
                <a th:href="@{/admin/events/{id}/edit(id=${e.id})}">Редакция</a>
                <form
                  th:action="@{/admin/events/{id}/delete(id=${e.id})}"
                  method="post"
                  onsubmit="return confirm('Сигурни ли сте?');"
                >
                  <button class="danger">Изтрий</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
