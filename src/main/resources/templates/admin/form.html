<!doctype html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Редактор | EventHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <header th:replace="~{fragments/nav :: nav}"></header>
    <main class="container narrow">
      <section class="panel">
        <h1 th:text="${editing}?'Редакция на събитие':'Ново събитие'"></h1>
        <form
          th:action="@{/admin/events/save}"
          th:object="${event}"
          method="post"
          class="stack"
        >
          <input type="hidden" th:field="*{id}" />
          <div class="alert error" th:if="${#fields.hasAnyErrors()}">
            Проверете въведените данни.
            <span
              th:each="err : ${#fields.allErrors()}"
              th:text="${err}+' '"
            ></span>
          </div>
          <label
            >Заглавие<input
              th:field="*{title}"
              required
              maxlength="120" /></label
          ><label
            >Описание<textarea
              th:field="*{description}"
              required
              maxlength="2000"
              rows="5"
            ></textarea></label
          ><label
            >Място<input
              th:field="*{location}"
              required
              maxlength="120" /></label
          ><label
            >Начало<input
              type="datetime-local"
              th:field="*{startsAt}"
              required /></label
          ><label
            >Капацитет<input
              type="number"
              th:field="*{capacity}"
              min="1"
              max="100000"
              required /></label
          ><button class="btn">Запази</button>
        </form>
      </section>
    </main>
  </body>
</html>
